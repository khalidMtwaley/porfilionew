  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khalid Mohamed — Flutter Developer based in Mansoura, Egypt. Building high-quality mobile apps with Flutter & Dart: real-time video calling, e-commerce, delivery and healthcare platforms.">
  <meta name="author" content="Khalid Mohamed">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Khalid Mohamed — Flutter Developer">
  <meta property="og:description" content="Flutter Developer with 11+ shipped apps across video calling, e-commerce, delivery and healthcare.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Khalid Mohamed — Flutter Developer">
  <meta name="twitter:description" content="Flutter Developer with 11+ shipped apps across video calling, e-commerce, delivery and healthcare.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Khalid Mohamed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Khalid Mohamed — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html, body { margin: 0; padding: 0; background: #0A0A0F; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #0A0A0F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .mark {
      color: #64FFDA;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 2px solid #64FFDA;
      border-radius: 8px;
      padding: 10px 18px;
    }
    #loading .bar {
      width: 160px;
      height: 2px;
      background: #262631;
      overflow: hidden;
      border-radius: 2px;
    }
    #loading .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #64FFDA;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

  <div id="loading">
    <div class="mark">K</div>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("loading");
      if (!el) return;
      el.classList.add("hidden");
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
